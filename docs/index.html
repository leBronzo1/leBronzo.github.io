<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./resources/css/style.css">
    <script src="./resources/js/script.js"></script>
  </head>
  <body>
    <div class="row">
        <div class="col-2">
            <div class="custom-container">
                <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#event_modal" onclick="clearEditingState()">Create Event</button>
            </div>
        </div>
        
        <div class="modal" id="event_modal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="event_form">
                        <div class="modal-header">
                            <h5 class="modal-title">Create Event</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p>
                                <label for="event_name">Event Name:</label> <br>
                                <input type="text" id="event_name" name="event_name" placeholder="Enter event name/purpose" style="width: 450px;" required> <br>
                                <label for="event_category">Event Category:</label> <br>
                                <select id="event_category" style="width: 450px;" required>
                                    <option value="academic">Academic</option>
                                    <option value="personal">Personal</option>
                                    <option value="work">Work</option>
                                </select> <br>
                                <label for="event_weekday">Weekday:</label> <br>
                                <select id="event_weekday" style="width: 450px;" required>
                                    <option value="monday">Monday</option>
                                    <option value="tuesday">Tuesday</option>
                                    <option value="wednesday">Wednesday</option>
                                    <option value="thursday">Thursday</option>
                                    <option value="friday">Friday</option>
                                    <option value="saturday">Saturday</option>
                                    <option value="sunday">Sunday</option>
                                </select> <br>
                                <label for="event_time">Select a time:</label> <br>
                                <input type="time" id="event_time" style="width: 450px;" required> <br>
                                <label for="event_modality">Event Modality: </label> <br>
                                <select id="event_modality" style="width: 450px;" onchange="updateLocationOptions()" required>
                                    <option value="in-person">In Person</option>
                                    <option value="remote">Remote</option>
                                </select> <br>
                                <div id="place" style="width: 450px; display: none;">
                                    <label for="event_location">Location:</label> <br>
                                    <input type="text" id="event_location" name="event_location" placeholder="Enter event location" style="width: 450px;">
                                </div>
                                <div id="URL" style="width: 450px; display: none;">
                                    <label for="event_remote_url">Meeting URL (Zoom, MS Teams etc.):</label><br>
                                    <input type="text" id="event_remote_url" placeholder="e.g., https://zoom.us" style="width: 450px;" pattern="https?://(www\.)?[a-zA-Z0-9-]+\.[a-zA-Z]{2,}.*">
                                </div>
                                <label for="event_attendees">Attendees:</label><br>
                                <input type="text" id="event_attendees" name="event_attendees" placeholder="Enter attendee names, separated by commas" style="width: 450px;">
                            </p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary" onclick="saveEvent(event)" data-bs-dismiss="modal">Save Event</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col">
            <div class="container-md container-fluid py-4 h-100">
                <div id="calendar" class="row h-100">
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
                        <div class="h6 text-center position-relative py-2 day">
                            Sunday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
                        <div class="h6 text-center position-relative py-2 day">
                            Monday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Tuesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Wednesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
                        <div class="h6 text-center position-relative py-2 day">
                            Thursday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
                        <div class="h6 text-center position-relative py-2 day">
                            Friday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
                        <div class="h6 text-center position-relative py-2 day">
                            Saturday
                        </div>
                    </div>
                </div>        
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
